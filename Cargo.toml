[workspace]
resolver = "2"
members = [
  "crates/caseflow-core",
  "crates/caseflow-api",
]
default-members = ["crates/caseflow-api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["CaseFlow"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
jsonwebtoken = "9"
bcrypt = "0.15"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
dotenvy = "0.15"
tracing = "0.1"
http = "1"
vercel_runtime = "1.1.6"
caseflow-core = { path = "crates/caseflow-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
