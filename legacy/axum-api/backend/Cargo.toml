[package]
name = "caseflow_cms"
version = "0.1.0"
edition = "2021"
description = "Production-ready CMS backend (Axum + SQLx + PostgreSQL)"
license = "MIT"
authors = ["CaseFlow"]

[dependencies]
# Web
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "request-id", "set-header", "compression-gzip"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
futures-util = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "json"] }

# Auth & security
jsonwebtoken = "9"
bcrypt = "0.15"
oauth2 = { version = "4", features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

# Serialization / validation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.19", features = ["derive"] }

# Config / utils
dotenvy = "0.15"
config = "0.14"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
slug = "0.1"
url = "2"
base64 = "0.22"
parking_lot = "0.12"
dashmap = "6"
tokio-stream = "0.1"

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[dev-dependencies]
tokio-test = "0.4"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "caseflow_cms"
path = "src/main.rs"

[lib]
name = "caseflow_cms"
path = "src/lib.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
