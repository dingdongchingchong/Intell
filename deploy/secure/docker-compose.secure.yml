# Private-network compose: Postgres + app published on loopback / private IP only.
# Usage:
#   export PRIVATE_IP=192.168.100.10
#   docker compose -f deploy/secure/docker-compose.secure.yml --env-file backend/.env.production up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: caseflow
      POSTGRES_PASSWORD: ${DB_PASS:?set DB_PASS}
      POSTGRES_DB: caseflow_db
    # Bind Postgres to localhost ONLY — never 0.0.0.0
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - caseflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseflow -d caseflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: serve static frontend + proxy to API on private IP via a host process.
  # The Rust binary typically runs on the host (or a separate container) with APP_HOST=$PRIVATE_IP.

volumes:
  caseflow_pg:
