# CaseFlow behind NGINX — TLS + IP allowlist (VPN/LAN only)
# Install: sudo cp caseflow.conf /etc/nginx/sites-available/ && ln -s ... && nginx -t && systemctl reload nginx

# Limit map optional — deny by default via allow/deny below
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name caseflow.internal;

    ssl_certificate     /etc/ssl/certs/caseflow.crt;
    ssl_certificate_key /etc/ssl/private/caseflow.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # --- VPN / LAN whitelist (edit to match your network) ---
    allow 10.8.0.0/24;         # OpenVPN
    allow 10.0.0.0/16;         # WireGuard / cloud VPC
    allow 192.168.100.0/24;    # Corporate LAN
    allow 100.64.0.0/10;       # Tailscale CGNAT
    deny  all;

    # Optional: require client certs in addition to VPN
    # ssl_client_certificate /etc/ssl/certs/caseflow-ca.crt;
    # ssl_verify_client on;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
    }

    access_log /var/log/nginx/caseflow.access.log;
    error_log  /var/log/nginx/caseflow.error.log;
}

# Do not expose :80 publicly; optional redirect only on private networks
server {
    listen 80;
    server_name caseflow.internal;
    allow 10.8.0.0/24;
    allow 192.168.100.0/24;
    allow 100.64.0.0/10;
    deny all;
    return 301 https://$host$request_uri;
}
